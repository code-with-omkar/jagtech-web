<header class="header" [class.header--solid]="scrolled() || menuOpen()">
  <div class="container bar">
    <a routerLink="/" class="brand" aria-label="JagTech home">
      <app-logo />
    </a>

    <nav class="nav" aria-label="Primary">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          class="nav-link"
        >{{ link.label }}</a>
      }
      <a class="btn btn--outline btn-sm" [href]="githubUrl" target="_blank" rel="noopener noreferrer">
        GitHub <span aria-hidden="true">↗</span>
      </a>
      <app-theme-toggle />
    </nav>

    <div class="mobile-actions">
      <app-theme-toggle />
      <button
        #menuButton
        type="button"
        class="burger"
        [class.is-open]="menuOpen()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile">
      <div class="container">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            class="mobile-link"
          >{{ link.label }}</a>
        }
        <a class="mobile-link" [href]="githubUrl" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </nav>
  }
</header>
