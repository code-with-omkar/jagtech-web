<header class="header" [class.header--solid]="scrolled() || menuOpen()">
  <div class="container bar">
    <a
      routerLink="/"
      class="home"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      aria-label="Home"
      title="Home"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9" />
      </svg>
    </a>

    <nav class="nav" aria-label="Primary">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          class="nav-link"
        >{{ link.label }}</a>
      }
      <a class="btn btn--outline btn-sm" [href]="social.github" target="_blank" rel="noopener noreferrer">
        GitHub <span aria-hidden="true">↗</span>
      </a>
      <a class="btn btn--outline btn-sm" [href]="social.linkedin" target="_blank" rel="noopener noreferrer">
        LinkedIn <span aria-hidden="true">↗</span>
      </a>
      <app-theme-toggle />
    </nav>

    <div class="mobile-actions">
      <app-theme-toggle />
      <button
        #menuButton
        type="button"
        class="burger"
        [class.is-open]="menuOpen()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile">
      <div class="container">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            class="mobile-link"
          >{{ link.label }}</a>
        }
        <a class="mobile-link" [href]="social.github" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <a class="mobile-link" [href]="social.linkedin" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      </div>
    </nav>
  }
</header>
