name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false

      - name: Build + prerender + package for Cloudflare Pages
        run: npm run build:cloudflare

      - name: Check prerendered output
        run: |
          set -eu
          d=dist/cloudflare
          for f in index.html projects/index.html about/index.html contact/index.html 404.html _headers sitemap.xml robots.txt; do
            test -s "$d/$f" || { echo "::error::missing $d/$f"; exit 1; }
          done
          n=$(find "$d/projects" -mindepth 2 -name index.html | wc -l)
          echo "Prerendered project pages: $n"
          test "$n" -gt 0

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/cloudflare/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://www.jagtech.in
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: 455afa58a11e182bfdec72affd692bc3
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Check deploy secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (needs Account → Cloudflare Pages → Edit)."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --yes wrangler@3.114.17 pages deploy site
          --project-name jagtech-web
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=true
